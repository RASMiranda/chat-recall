name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a draft release for the version in package.json (main branch only)'
        type: boolean
        default: false

permissions:
  contents: write # needed only to create/update the draft release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make sure the zip tool exists
        run: which zip || sudo apt-get install -y zip

      - name: Unit tests
        run: npm test

      - name: UI smoke test (jsdom, fake claude.ai API)
        run: |
          npm install --no-save jsdom
          node scripts/smoke-ui.js

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "v$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG. Bump the version, commit, and tag again."
            exit 1
          fi

      - name: Build Chrome and Firefox packages
        run: npm run build

      - name: Lint the Firefox build
        run: npx --yes web-ext lint --source-dir dist/firefox

      - name: Source archive (exact commit)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          git archive --format=zip -o "dist/chat-recall-source-${VERSION}.zip" HEAD

      - name: Keep the zips from every build
        uses: actions/upload-artifact@v4
        with:
          name: chat-recall-zips
          path: dist/*.zip
          if-no-files-found: error

      - name: Draft release with the zips (tag pushes, or a manual run with "release" ticked on main)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$PKG"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --draft --target "$GITHUB_SHA" --title "Chat Recall ${TAG#v}" --notes "Automated build of $TAG. Unofficial; not affiliated with Anthropic. It reads claude.ai's undocumented internal API, so it may break when claude.ai changes. Install for testing: Firefox: about:debugging -> This Firefox -> Load Temporary Add-on -> manifest.json from the unzipped firefox build. Chrome: chrome://extensions -> Developer mode -> Load unpacked -> the unzipped chrome build."
          fi
